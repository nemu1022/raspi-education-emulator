<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Virtual Raspberry Pi Emulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Virtual Raspberry Pi Emulator</h1>

    <div class="container">

        <div class="left-panel">

            <h2>C Program</h2>

            <div class="tabs">

    <button onclick="showTab('main')">
        main.c
    </button>

    <button onclick="showTab('const')">
        const.h
    </button>

</div>

<textarea id="mainCode" class="editor">
</textarea>

<textarea
    id="constCode"
    class="editor"
    style="display:none;">
// GPIOを操作するための番地
#define GPIO_BASE       (volatile int *)0x3f200000
#define GPFSEL0         (GPIO_BASE + 0)  // GPIO #0〜9の機能選択
#define GPFSEL1         (GPIO_BASE + 1)  // GPIO #10〜19の機能選択
#define GPFSEL2         (GPIO_BASE + 2)  // GPIO #20〜29の機能選択
#define GPSET0          (GPIO_BASE + 7)  // 出力値を1にする
#define GPCLR0          (GPIO_BASE + 10) // 出力値を0にする
#define GPLEV0          (GPIO_BASE + 13) // 入力値を読み出す

// GPFSELxに設定する値
#define GPFSEL_VEC1     1   // GPFSEL1用 (#10のみ出力)

// 各装置が接続されているGPIO番号
#define LED_PORT        10  // LED

#define SW1_PORT        13  // SW1
</textarea>


            <br>

            <button onclick="runCode()">実行</button>

        </div>

        <div class="right-panel">

            <h2>Virtual I/O Board</h2>

<div class="led-area">

    <p>Green LED</p>

    <div id="led" class="led off"></div>

</div>

<div class="switch-area">

    <p>SW1</p>

    <button
    id="sw1"
    onmousedown="sw1Pressed = true"
    onmouseup="sw1Pressed = false"
    onmouseleave="sw1Pressed = false">

    SW1

</button>

</div>



            <h2>Registers</h2>

            <pre id="registers"></pre>

            <h2>GPIO State</h2>

            <pre id="gpio"></pre>

            <h2>Execution Log</h2>

            <pre id="log"></pre>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
