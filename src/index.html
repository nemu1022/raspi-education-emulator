<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Virtual Raspberry Pi Emulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>
        <center>Virtual Raspberry Pi Emulator</center>
    </h1>

    <div class="container">


        <div class="left-panel">

            <h2>C Program</h2>

            <div class="tabs">
                <button id="mainTab" class="tab-button" onclick="showTab('main')">
                    main.c
                </button>

                <button id="constTab" class="tab-button" onclick="showTab('const')">
                    const.h
                </button>
            </div>


            <textarea id="mainCode" class="editor">
#include "const.h"      // 定数の定義を読み込む

int main(void) 
{
    int sw;

    // GPIOの機能設定
    *GPFSEL1 = GPFSEL_VEC1;  // #10〜#19の設定

    while(1){
        
    // GPLEV0の値 (GPIO #0〜#31それぞれが読み取った値) をswに代入
    sw = *GPLEV0;

        // SW1が押されているか?
        if (sw & (1 << SW1_PORT)) {
            *GPSET0 = 1 << LED_PORT; // SW1が押されていたらここが実行される
        } else {
            *GPCLR0 = 1 << LED_PORT;
        }
    }

    return 0;  // init.sに戻る
}

            </textarea>

            <textarea id="constCode" class="editor" style="display:none;">
// GPIOを操作するための番地
#define GPIO_BASE       (volatile int *)0x3f200000
#define GPFSEL0         (GPIO_BASE + 0)  // GPIO #0〜9の機能選択
#define GPFSEL1         (GPIO_BASE + 1)  // GPIO #10〜19の機能選択
#define GPFSEL2         (GPIO_BASE + 2)  // GPIO #20〜29の機能選択
#define GPSET0          (GPIO_BASE + 7)  // 出力値を1にする
#define GPCLR0          (GPIO_BASE + 10) // 出力値を0にする
#define GPLEV0          (GPIO_BASE + 13) // 入力値を読み出す

// GPFSELxに設定する値
#define GPFSEL_VEC1     1   // GPFSEL1用 (#10のみ出力)

// 各装置が接続されているGPIO番号
#define LED_PORT        10  // LED

#define SW1_PORT        13  // SW1

            </textarea>


            <div id="status" class="status-area"></div>


            <button onclick="runCode()">実行</button>
            <button onclick="stopCode()">停止</button>

        </div>

        <div class="right-panel">

            <h2>Virtual I/O Board</h2>

            <div class="led-area">

                <p>LED</p>

                <div id="led" class="led off"></div>

            </div>


            <div class="switch-area">

                <p>スイッチ</p>

                <button id="sw1" onmousedown="sw1Pressed = true" onmouseup="sw1Pressed = false"
                    onmouseleave="sw1Pressed = false">

                    SW1

                </button>

                <button id="sw2" onmousedown="sw2Pressed = true" onmouseup="sw2Pressed = false"
                    onmouseleave="sw2Pressed = false">

                    SW2

                </button>

                <button id="sw3" onmousedown="sw3Pressed = true" onmouseup="sw3Pressed = false"
                    onmouseleave="sw3Pressed = false">

                    SW3

                </button>

                <button id="sw4" onmousedown="sw4Pressed = true" onmouseup="sw4Pressed = false"
                    onmouseleave="sw4Pressed = false">

                    SW4

                </button>

            </div>

            <div class="matrix-area">

                <p>8x8ドットマトリックスLED</p>

                <div id="ledMatrix" class="led-matrix">
                </div>

            </div>

            <h2>Registers</h2>

            <pre id="registers"></pre>

            <h2>GPIO State</h2>

            <pre id="gpio"></pre>

            <h2>Execution Log</h2>

            <pre id="log"></pre>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
